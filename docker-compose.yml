services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_HERE_API_KEY: ${NEXT_PUBLIC_HERE_API_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HERE_API_KEY: ${HERE_API_KEY}
      NEXT_PUBLIC_HERE_API_KEY: ${NEXT_PUBLIC_HERE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      AUTH_SECRET: ${AUTH_SECRET}
      QLDTRAFFIC_API_KEY: ${QLDTRAFFIC_API_KEY:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-24}
      AGENT_MAX_RUN_COST_USD: ${AGENT_MAX_RUN_COST_USD:-0.25}
      AGENT_DAILY_SPEND_CAP_USD: ${AGENT_DAILY_SPEND_CAP_USD:-5}
      AUTO_EXECUTE_LOW_RISK: ${AUTO_EXECUTE_LOW_RISK:-1}
      DB_PATH: /app/data/drover.db
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    mem_limit: 700m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
