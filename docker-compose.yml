services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_HERE_API_KEY: ${NEXT_PUBLIC_HERE_API_KEY}
    restart: unless-stopped
    environment:
      HERE_API_KEY: ${HERE_API_KEY}
      NEXT_PUBLIC_HERE_API_KEY: ${NEXT_PUBLIC_HERE_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      FMCSA_WEBKEY: ${FMCSA_WEBKEY}
      DB_PATH: /app/data/overdrive.db
    volumes:
      - overdrive_data:/app/data
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
  overdrive_data:
