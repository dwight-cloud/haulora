services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_HERE_API_KEY: ${NEXT_PUBLIC_HERE_API_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HERE_API_KEY: ${HERE_API_KEY}
      NEXT_PUBLIC_HERE_API_KEY: ${NEXT_PUBLIC_HERE_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET}
      QLDTRAFFIC_API_KEY: ${QLDTRAFFIC_API_KEY:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-24}
      AGENT_MAX_RUN_COST_USD: ${AGENT_MAX_RUN_COST_USD:-0.6}
      AGENT_DAILY_SPEND_CAP_USD: ${AGENT_DAILY_SPEND_CAP_USD:-10}
      AUTO_EXECUTE_LOW_RISK: ${AUTO_EXECUTE_LOW_RISK:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DB_PATH: /app/data/fleet.db
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    mem_limit: 700m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
